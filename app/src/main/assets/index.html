<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="简洁的个人事项提醒与任务管理页面。">
  <meta name="theme-color" content="#08101d">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Cpath d='M17 33l9 9 21-23' fill='none' stroke='%23ffca5c' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <title>事项提醒</title>
  <script>
    var requestedView = new URLSearchParams(location.search).get('view');

  </script>
  <style>

    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:320px;color:var(--ink);font-size:16px;line-height:1.5;background:linear-gradient(rgba(80,120,180,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(80,120,180,.055) 1px,transparent 1px),radial-gradient(circle at 85% 0,rgba(63,132,235,.18),transparent 28rem),var(--bg);background-size:32px 32px,32px 32px,auto,auto}

    .topbar .shell{min-height:64px;display:flex;align-items:center;gap:20px}.brand{display:flex;align-items:center;gap:10px;font-weight:850;text-decoration:none;white-space:nowrap}.brand-mark{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:var(--yellow);color:#07101d}
    nav{display:flex;gap:6px;margin-left:auto}nav a{padding:8px 12px;border-radius:9px;text-decoration:none;color:var(--muted);font-size:.92rem}nav a:hover,nav a:focus-visible{color:var(--ink);background:#17253c;outline:none}
    html[data-view="now"] [data-nav="now"],html[data-view="all"] [data-nav="all"],html[data-view="history"] [data-nav="history"],html[data-view="schedule"] [data-nav="schedule"]{color:#07101d;background:var(--yellow);font-weight:800}
    main{padding:34px 0 72px}.view{display:none}html[data-view="now"] #nowView,html[data-view="all"] #allView,html[data-view="history"] #historyView,html[data-view="schedule"] #scheduleView{display:block}
    .page-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.eyebrow{margin:0 0 5px;color:var(--blue);font-size:.76rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font-size:clamp(2rem,5vw,3.6rem);line-height:1;letter-spacing:-.05em}.lead{margin:10px 0 0;color:var(--muted)}
    .actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#132139;padding:9px 13px;border-radius:9px;cursor:pointer;font-weight:750}.btn:hover,.btn:focus-visible{border-color:var(--blue);outline:none}.btn.primary{background:var(--yellow);border-color:var(--yellow);color:#07101d}.btn.small{padding:6px 9px;font-size:.82rem}.btn.ghost{background:transparent}.btn.danger{color:#ffb0ab}
    .panel{border:1px solid var(--line);border-radius:15px;background:rgba(16,27,46,.9);box-shadow:var(--shadow)}
    .reminders{padding:18px;margin-bottom:30px}.reminder-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.reminder-head h2{margin:0;font-size:1.15rem}.reminder-head span{color:var(--muted);font-size:.85rem}
    .reminder-list{display:flex;flex-wrap:wrap;gap:8px}.reminder{display:inline-flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #35455f;border-radius:9px;background:#0d1829;font-weight:700}.reminder b{font-size:.74rem;color:var(--yellow)}.reminder.overdue{border-color:#713c42}.reminder.overdue b{color:#ffaaa5}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #35455e;border-radius:12px}
    .section{margin-top:35px;scroll-margin-top:82px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:12px}.section-head h2{margin:0;font-size:1.45rem}.section-head p{margin:2px 0 0;color:var(--muted);font-size:.86rem}
    .task-list{display:grid;gap:8px}.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 13px;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:11px;background:var(--panel2)}.task.u5{border-left-color:var(--red)}.task.u4{border-left-color:var(--orange)}.task.u3{border-left-color:var(--yellow)}.task.u2{border-left-color:var(--blue)}.task.u1{border-left-color:var(--green)}.task.done{opacity:.58}.task.done .task-title{text-decoration:line-through;color:var(--muted)}
    .done-box{width:20px;height:20px;accent-color:var(--green);cursor:pointer}.task-title{font-weight:780;overflow-wrap:anywhere}.meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:5px}.pill{display:inline-flex;padding:3px 7px;border:1px solid #33445e;border-radius:7px;color:var(--muted);font-size:.76rem}.pill.overdue{color:#ffaaa5;border-color:#713c42}.urgency{width:auto;min-height:27px;padding:2px 6px;border:1px solid #33445e;border-radius:7px;background:#111e32;color:var(--ink);font-size:.76rem}
    .task-actions{display:flex;gap:4px}.icon{width:32px;height:31px;border:1px solid #31415c;border-radius:8px;background:#142239;cursor:pointer}.icon:hover,.icon:focus-visible{border-color:var(--blue);outline:none}.icon:disabled{opacity:.35;cursor:default}
    .toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;padding:14px;margin-bottom:14px}.field{display:grid;gap:5px}.field.grow{flex:1;min-width:180px}.field label{font-size:.8rem;color:#c4cfe2;font-weight:700}input,select{width:100%;border:1px solid #34445f;border-radius:9px;background:#0b1525;color:var(--ink);padding:9px 10px}input:focus,select:focus{border-color:var(--blue);outline:2px solid rgba(90,171,255,.14)}
    dialog{width:min(540px,calc(100% - 24px));padding:0;border:1px solid var(--line);border-radius:16px;background:#0e192b;color:var(--ink);box-shadow:0 32px 90px rgba(0,0,0,.55)}dialog::backdrop{background:rgba(3,8,15,.72);backdrop-filter:blur(5px)}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0}.dialog-body{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:13px}.dialog-body .wide{grid-column:1/-1}.dialog-foot{display:flex;justify-content:flex-end;gap:9px;padding:15px 20px;border-top:1px solid var(--line)}.range-row{display:flex;align-items:center;gap:10px}.range-row input{padding:4px 0;border:0;accent-color:var(--yellow)}.range-row output{min-width:82px;color:var(--yellow);font-weight:800}.hint{font-size:.78rem;color:var(--muted)}
    .quick-times{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.quick-times .btn{padding:5px 8px;font-size:.78rem}.time-link{background:transparent;cursor:pointer}.check-row{display:flex;align-items:center;gap:9px;color:#c4cfe2;font-weight:700}.check-row input{width:18px;height:18px;accent-color:var(--yellow)}.history-actions{display:flex;gap:7px;flex-wrap:wrap}.toast{position:fixed;right:18px;bottom:18px;z-index:40;max-width:320px;padding:11px 14px;border:1px solid #36516a;border-radius:10px;background:#11243a;box-shadow:var(--shadow);transform:translateY(100px);opacity:0;transition:.2s}.toast.show{transform:none;opacity:1}
    .schedule-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.week-label{min-width:120px;text-align:center;font-weight:800}.schedule-scroll{max-height:calc(100vh - 250px);overflow:auto;border:1px solid var(--line);border-radius:13px;background:var(--line)}.schedule-grid{min-width:1010px;display:grid;grid-template-columns:76px repeat(7,minmax(132px,1fr));grid-template-rows:54px repeat(12,76px);gap:1px}.schedule-corner,.day-head,.time-axis{position:sticky;z-index:5;background:#101b2e}.schedule-corner{top:0;left:0;z-index:8;display:grid;place-items:center;color:var(--muted);font-size:.72rem;text-align:center}.day-head{top:0;display:grid;place-items:center;text-align:center}.day-head.today{color:#07101d;background:var(--yellow)}.day-head b,.day-head span{display:block}.day-head span{color:inherit;opacity:.75;font-size:.74rem}.time-axis{left:0;z-index:4;display:grid;place-items:center;padding:4px;text-align:center}.time-axis b{font-size:.8rem}.time-axis span{color:var(--muted);font-size:.65rem;line-height:1.25}.slot{background:#0c1626}.slot.today{background:#101d31}.course-stack{z-index:2;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;padding:3px;min-width:0}.course{min-width:0;height:100%;padding:7px;border-left:4px solid var(--blue);border-radius:7px;background:#18304f;overflow:hidden}.course.c1{border-left-color:var(--yellow);background:#3a3020}.course.c2{border-left-color:var(--green);background:#16382f}.course.c3{border-left-color:var(--orange);background:#3a281e}.course.c4{border-left-color:#ba8cff;background:#2b2444}.course b{display:block;font-size:.78rem;line-height:1.25;overflow-wrap:anywhere}.course span{display:block;margin-top:4px;color:#c0cce0;font-size:.66rem;line-height:1.25;overflow-wrap:anywhere}.update-note{margin-bottom:18px;padding:10px 13px;border:1px solid #38516c;border-radius:10px;background:#10243a;color:#c8d8ee;font-size:.88rem}
    @media(max-width:680px){.shell{width:min(100% - 22px,1040px)}.topbar .shell{display:block;padding:10px 0 8px}nav{margin:7px 0 0;overflow-x:auto;padding-bottom:2px}nav a{white-space:nowrap}.page-head{align-items:start;flex-direction:column}.task{grid-template-columns:auto minmax(0,1fr)}.task-actions{grid-column:2}.toolbar{align-items:stretch;flex-direction:column}.field.grow{min-width:0}.dialog-body{grid-template-columns:1fr}.dialog-body .wide{grid-column:auto}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.toast{transition:none}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="shell">
      <a class="brand" href="index.html"><span class="brand-mark">✓</span>事项提醒</a>
      <nav aria-label="页面导航"><a data-nav="now" href="index.html">今天 / 本周</a><a data-nav="schedule" href="index.html?view=schedule">课表</a><a data-nav="all" href="index.html?view=all">全部事项</a><a data-nav="history" href="index.html?view=history">完成记录</a></nav>
    </div>
  </header>

  <main class="shell">
    <section class="view" id="nowView">
      <div class="page-head">
        <div><p class="eyebrow">Reminder</p><h1>需要做什么。</h1><p class="lead">提醒区只显示今天需要处理和已经逾期的事项。</p></div>
        <div class="actions"><button class="btn" id="checkUpdate" type="button">检查更新</button><button class="btn primary" type="button" data-add="today">＋ 添加事项</button></div>
      </div>
      <section class="panel reminders" aria-labelledby="reminderTitle">
        <div class="reminder-head"><h2 id="reminderTitle">提醒</h2><span id="reminderCount">0 项</span></div>
        <div class="reminder-list" id="reminderList"></div>
      </section>
      <section class="section" id="today">
        <div class="section-head"><div><p class="eyebrow">Today</p><h2>今天</h2></div><button class="btn small" type="button" data-add="today">＋ 添加</button></div>
        <div class="task-list" id="todayList"></div>
      </section>
      <section class="section" id="week">
        <div class="section-head"><div><p class="eyebrow">This week</p><h2>本周</h2></div><button class="btn small" type="button" data-add="week">＋ 添加</button></div>
        <div class="task-list" id="weekList"></div>
      </section>
    </section>

    <section class="view" id="scheduleView">
      <div class="page-head">
        <div><p class="eyebrow">Timetable</p><h1>课表。</h1><p class="lead">按周查看课程；课表文件只在手机本地解析。</p></div>
        <div class="actions"><button class="btn primary" id="importSchedule" type="button">导入课表</button></div>
        <input id="scheduleFile" type="file" accept=".xls,.xlsx" hidden>
      </div>
      <div class="update-note">版本 1.7.0 · 应用启动后每天自动检查一次更新，也可在“今天 / 本周”主动检查。</div>
      <div class="panel toolbar schedule-tools">
        <button class="btn small" id="prevWeek" type="button">← 上一周</button>
        <button class="btn small" id="currentWeek" type="button">本周</button>
        <span class="week-label" id="weekLabel"></span>
        <button class="btn small" id="nextWeek" type="button">下一周 →</button>
      </div>
      <div class="schedule-scroll"><div class="schedule-grid" id="scheduleGrid"></div></div>
    </section>

    <section class="view" id="allView">
      <div class="page-head">
        <div><p class="eyebrow">All tasks</p><h1>全部事项。</h1><p class="lead">分配、排序和调整紧迫度。</p></div>
        <div class="actions"><button class="btn" id="autoUrgency" type="button">全部改为自动</button><button class="btn primary" type="button" data-add="cycle">＋ 添加事项</button></div>
      </div>
      <div class="panel toolbar">
        <div class="field grow"><label for="search">搜索</label><input id="search" type="search" placeholder="事项名称"></div>
        <div class="field"><label for="stageFilter">阶段</label><select id="stageFilter"><option value="all">全部</option><option value="today">今天</option><option value="week">本周</option><option value="cycle">长期</option></select></div>
        <div class="field"><label for="sortMode">排序</label><select id="sortMode"><option value="manual">我的顺序</option><option value="urgency">紧迫度</option><option value="due">截止时间</option></select></div>
      </div>
      <div class="task-list" id="allList"></div>
    </section>

    <section class="view" id="historyView">
      <div class="page-head">
        <div><p class="eyebrow">History</p><h1>完成记录。</h1><p class="lead">已完成事项保留在这里，可恢复或永久删除。</p></div>
        <div class="actions"><span class="pill" id="historyCount">0 条记录</span></div>
      </div>
      <div class="task-list" id="historyList"></div>
    </section>
  </main>

  <dialog id="taskDialog">
    <form id="taskForm">
      <div class="dialog-head"><h2 id="dialogTitle">添加事项</h2><button class="icon" type="button" data-close aria-label="关闭">×</button></div>
      <div class="dialog-body">
        <input id="taskId" type="hidden">
        <div class="field wide"><label for="taskTitle">事项</label><input id="taskTitle" required maxlength="60" placeholder="例如：完成报告"></div>
        <div class="field wide"><label for="taskDue">计划完成时间</label><input id="taskDue" type="datetime-local"><div class="quick-times"><button class="btn ghost" type="button" data-time="today">今天 21:00</button><button class="btn ghost" type="button" data-time="tomorrow">明天 21:00</button><button class="btn ghost" type="button" data-time="week">本周日</button><button class="btn ghost" type="button" data-time="clear">清除</button></div></div>
        <div class="field"><label for="taskStage">分配到</label><select id="taskStage"><option value="today">今天</option><option value="week">本周</option><option value="cycle">长期</option></select></div>
        <div class="field"><label for="taskRepeat">重复周期</label><select id="taskRepeat"><option value="none">不重复</option><option value="daily">每天</option><option value="weekly">每周</option><option value="monthly">每月</option><option value="yearly">每年</option></select></div>
        <div class="field wide"><label class="check-row"><input id="taskAutoUrgency" type="checkbox" checked>随时间自动调整紧迫度</label><div class="range-row"><input id="taskUrgency" type="range" min="1" max="5" step="1" value="3"><output id="urgencyOutput">3 · 关注</output></div><div class="hint" id="urgencyHint">越接近计划时间，紧迫度越高。</div></div>
      </div>
      <div class="dialog-foot"><button class="btn ghost" type="button" data-close>取消</button><button class="btn primary" type="submit">保存</button></div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>


<script src="xlsx.full.min.js"></script>
<script>
(function(){
'use strict';
var KEY='study-command-tasks-v5',LEGACY_KEY='study-command-tasks-v4',labels={1:'从容',2:'计划',3:'关注',4:'紧迫',5:'立即'},stages={today:'今天',week:'本周',cycle:'长期'};
var repeats={none:'不重复',daily:'每天',weekly:'每周',monthly:'每月',yearly:'每年'};
var defaults=[];
var tasks=load(),dialog=document.getElementById('taskDialog'),form=document.getElementById('taskForm'),toastTimer,scheduleWeek=0;
function newId(){return crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2);}
function addPeriod(d,repeat){var day;if(repeat==='daily')d.setDate(d.getDate()+1);if(repeat==='weekly')d.setDate(d.getDate()+7);if(repeat==='monthly'){day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));}if(repeat==='yearly'){day=d.getDate();var month=d.getMonth();d.setDate(1);d.setFullYear(d.getFullYear()+1);d.setMonth(month);d.setDate(Math.min(day,new Date(d.getFullYear(),month+1,0).getDate()));}return d;}
function nextDue(value,repeat,after){if(!value||!repeats[repeat]||repeat==='none')return value||'';var d=new Date(value),limit=0;do{addPeriod(d,repeat);limit++;}while(d.getTime()<=after.getTime()&&limit<10000);return inputDate(d);}
function load(){try{var raw=localStorage.getItem(KEY)||localStorage.getItem(LEGACY_KEY),saved=JSON.parse(raw);if(!Array.isArray(saved))return defaults.slice();var added=[];saved.forEach(function(t){t.done=Boolean(t.done);if(typeof t.autoUrgency!=='boolean')t.autoUrgency=true;if(t.done&&typeof t.completedAt!=='string')t.completedAt='';if(!t.repeat)t.repeat=/mooc/i.test(t.title||'')?'weekly':'none';if(t.done&&t.repeat!=='none'&&!t.recurrenceParentId&&t.due){var active=Object.assign({},t,{id:newId(),done:false,completedAt:'',due:nextDue(t.due,t.repeat,new Date())});t.recurrenceParentId=active.id;added.push(active);}});return saved.concat(added);}catch(_){return defaults.slice();}}
function save(){localStorage.setItem(KEY,JSON.stringify(tasks));render();}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function recommend(due){if(!due)return 1;var h=(new Date(due).getTime()-Date.now())/36e5;if(h<=24)return 5;if(h<=72)return 4;if(h<=168)return 3;if(h<=336)return 2;return 1;}
function urgency(t){return t.autoUrgency===false?Number(t.urgency||1):recommend(t.due);}
console.assert(recommend(new Date(Date.now()+12*36e5).toISOString())===5&&recommend('')===1,'urgency check');
console.assert(urgency({autoUrgency:false,urgency:2,due:new Date().toISOString()})===2,'manual urgency check');
console.assert(nextDue('2026-01-01T21:00','weekly',new Date('2026-01-02T00:00')).slice(0,16)==='2026-01-08T21:00','weekly recurrence check');
console.assert(nextDue('2026-01-31T21:00','monthly',new Date('2026-02-01T00:00')).slice(0,16)==='2026-02-28T21:00','monthly recurrence check');
function overdue(t){return Boolean(t.due&&!t.done&&new Date(t.due).getTime()<Date.now());}
function dueText(value){if(!value)return '未设置时间';return new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(value));}
function card(t,manual){if(t.done)return '<article class="task done" data-id="'+esc(t.id)+'"><input class="done-box" data-action="done" type="checkbox" checked aria-label="恢复 '+esc(t.title)+'"><div><div class="task-title">'+esc(t.title)+'</div><div class="meta"><span class="pill">已完成</span><span class="pill">'+esc(t.completedAt?dueText(t.completedAt):'时间未记录')+'</span></div></div></article>';var u=urgency(t),options=[1,2,3,4,5].map(function(n){return '<option value="'+n+'"'+(u===n?' selected':'')+'>'+n+' · '+labels[n]+'</option>';}).join('');return '<article class="task u'+u+'" data-id="'+esc(t.id)+'"><input class="done-box" data-action="done" type="checkbox" aria-label="完成 '+esc(t.title)+'"><div><div class="task-title">'+esc(t.title)+'</div><div class="meta"><span class="pill">'+stages[t.stage]+'</span>'+(t.repeat&&t.repeat!=='none'?'<span class="pill">'+repeats[t.repeat]+'</span>':'')+'<button class="pill time-link'+(overdue(t)?' overdue':'')+'" data-action="edit" type="button">'+(overdue(t)?'已逾期 · ':'')+esc(dueText(t.due))+'</button><select class="urgency" data-action="urgency" aria-label="紧迫度">'+options+'</select>'+(t.autoUrgency!==false?'<span class="pill">自动</span>':'')+'</div></div><div class="task-actions"><button class="icon" data-action="up" type="button" aria-label="上移"'+(manual?'':' disabled')+'>↑</button><button class="icon" data-action="down" type="button" aria-label="下移"'+(manual?'':' disabled')+'>↓</button><button class="icon" data-action="edit" type="button" aria-label="编辑">✎</button><button class="icon" data-action="delete" type="button" aria-label="删除">×</button></div></article>';}

function importSchedule(file){var monday=prompt('请输入本学期第 1 周周一日期（YYYY-MM-DD）');if(!monday)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(monday)||isNaN(new Date(monday+'T00:00').getTime())){alert('日期格式不正确。');return;}var reader=new FileReader();reader.onload=function(){try{var workbook=XLSX.read(new Uint8Array(reader.result),{type:'array'}),rows=[];workbook.SheetNames.forEach(function(name){rows=rows.concat(XLSX.utils.sheet_to_json(workbook.Sheets[name],{defval:''}));});var weekdays={'星期一':0,'星期二':1,'星期三':2,'星期四':3,'星期五':4,'星期六':5,'星期日':6},existing=new Set(tasks.map(function(t){return t.sourceKey;}).filter(Boolean)),created=[],courses=new Set(),skipped=0;rows.forEach(function(row){var name=firstValue(row,['课程名','课程名称']),weeks=expandWeeks(firstValue(row,['上课周次','周次'])),day=weekdays[firstValue(row,['上课星期','星期'])],startText=firstValue(row,['开始节次','开始节']),endText=firstValue(row,['结束节次','结束节']),startMatch=startText.match(/\d+/),endMatch=endText.match(/\d+/),location=firstValue(row,['教室名称','教室']),courseNo=firstValue(row,['课程号','课程代码']);if(!name||!weeks.length||day===undefined||!startMatch){skipped++;return;}var start=Number(startMatch[0]),end=endMatch?Number(endMatch[0]):start,clean=name.replace(/^【[^】]+】/,'');courses.add(clean);weeks.forEach(function(week){var date=scheduleDue(monday,week,day,start);if(date.getTime()<dayStart())return;var key=['class',courseNo||clean,week,day,start,end].join(':'),title='[课程] '+clean+' · 第'+start+'-'+end+'节'+(location?' · '+location:'');if(!existing.has(key)){created.push({id:newId(),title:title,courseName:clean,room:location,startSection:start,endSection:end,due:inputDate(date),stage:'week',repeat:'none',urgency:3,autoUrgency:true,done:false,completedAt:'',sourceKey:key});existing.add(key);}if(/大学物理/.test(clean)){var moocKey='mooc:'+key,moocDate=new Date(date);moocDate.setDate(moocDate.getDate()-7);if(!existing.has(moocKey)){created.push({id:newId(),title:'完成大学物理 MOOC · 第'+week+'周课程',due:inputDate(moocDate),stage:'week',repeat:'none',urgency:3,aut
